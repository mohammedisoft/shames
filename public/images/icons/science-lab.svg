<!-- أيقونة العلوم والتجارب -->
<svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="beakerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F9AFF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#2B6CB0;stop-opacity:0.6" />
    </linearGradient>
    <radialGradient id="bubbleGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4F9AFF;stop-opacity:0.4" />
    </radialGradient>
  </defs>
  
  <!-- أنبوب الاختبار الأول -->
  <rect x="15" y="10" width="8" height="35" rx="4" fill="none" stroke="#666" stroke-width="2"/>
  <rect x="16" y="25" width="6" height="18" rx="3" fill="#22C55E" opacity="0.7"/>
  <rect x="18" y="8" width="4" height="4" rx="2" fill="#666"/>
  
  <!-- أنبوب الاختبار الثاني -->
  <rect x="30" y="15" width="8" height="30" rx="4" fill="none" stroke="#666" stroke-width="2"/>
  <rect x="31" y="30" width="6" height="13" rx="3" fill="#FF8FA3" opacity="0.7"/>
  <rect x="33" y="13" width="4" height="4" rx="2" fill="#666"/>
  
  <!-- كوب التجارب الكبير -->
  <path d="M42 20 L48 20 L50 40 C50 43 47 45 45 45 C43 45 40 43 40 40 Z" 
        fill="none" stroke="#666" stroke-width="2"/>
  <path d="M42 35 L48 35 L49 40 C49 42 47 43 45 43 C43 43 41 42 41 40 Z" 
        fill="url(#beakerGradient)"/>
  <rect x="43" y="18" width="4" height="4" rx="2" fill="#666"/>
  
  <!-- فقاعات متصاعدة -->
  <circle cx="17" cy="20" r="1" fill="url(#bubbleGradient)"/>
  <circle cx="20" cy="18" r="0.8" fill="url(#bubbleGradient)"/>
  <circle cx="19" cy="15" r="0.6" fill="url(#bubbleGradient)"/>
  
  <circle cx="32" cy="25" r="1.2" fill="url(#bubbleGradient)"/>
  <circle cx="35" cy="22" r="0.9" fill="url(#bubbleGradient)"/>
  <circle cx="36" cy="19" r="0.7" fill="url(#bubbleGradient)"/>
  
  <circle cx="44" cy="30" r="1.5" fill="url(#bubbleGradient)"/>
  <circle cx="46" cy="27" r="1.1" fill="url(#bubbleGradient)"/>
  <circle cx="47" cy="24" r="0.8" fill="url(#bubbleGradient)"/>
  
  <!-- نجوم علمية -->
  <g fill="#FFE066">
    <path d="M8 8 L9 11 L12 11 L10 13 L11 16 L8 14 L5 16 L6 13 L4 11 L7 11 Z"/>
    <path d="M52 8 L53 11 L56 11 L54 13 L55 16 L52 14 L49 16 L50 13 L48 11 L51 11 Z"/>
  </g>
  
  <!-- ذرة صغيرة -->
  <circle cx="25" cy="50" r="2" fill="#A855F7"/>
  <ellipse cx="25" cy="50" rx="6" ry="2" fill="none" stroke="#A855F7" stroke-width="1"/>
  <ellipse cx="25" cy="50" rx="2" ry="6" fill="none" stroke="#A855F7" stroke-width="1"/>
  <circle cx="31" cy="50" r="1" fill="#A855F7"/>
  <circle cx="19" cy="50" r="1" fill="#A855F7"/>
  <circle cx="25" cy="44" r="1" fill="#A855F7"/>
  <circle cx="25" cy="56" r="1" fill="#A855F7"/>
</svg>